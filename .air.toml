root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/capyclaw-gateway"
  cmd = "go build -o ./tmp/capyclaw-gateway ./cmd/gateway"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "web", "node_modules", "deploy", "docs", "tests"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "yaml"]
  kill_delay = "0s"
  send_interrupt = false
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
