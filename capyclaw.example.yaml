# capyclaw.example.yaml — CapyClaw main configuration example
# Copy to capyclaw.yaml and fill in your values.
# Environment variable override: CAPYCLAW_<SECTION>_<KEY>
# e.g., CAPYCLAW_RIVERBANK_PORT=18789

version: "1"

log_level: "info" # debug | info | warn | error

# ── Riverbank (Gateway) ────────────────────────────────────────────────────
riverbank:
  host: "0.0.0.0"
  port: 18789
  tls:
    enabled: true
    cert_path: "/etc/capyclaw/tls/cert.pem"
    key_path: "/etc/capyclaw/tls/key.pem"
    min_version: "1.3"
  websocket:
    max_connections: 10000
    ping_interval: "30s"
    pong_timeout: "10s"
    allowed_origins:
      - "https://your-domain.com"
  auth:
    provider: "oidc" # oidc | jwt | device-pairing
    oidc:
      issuer_url: "https://auth.your-domain.com"
      client_id: "capyclaw"
      client_secret: "vault:secret/capyclaw/oidc#client_secret"

# ── Pond (Storage) ─────────────────────────────────────────────────────────
pond:
  postgres:
    dsn: "vault:database/creds/capyclaw#dsn"
    max_conns: 50
    min_conns: 5
  redis:
    addr: "redis-cluster:6379"
    password: "vault:secret/capyclaw/redis#password"

# ── Lodge (Infrastructure) ────────────────────────────────────────────────
lodge:
  temporal:
    host_port: "temporal:7233"
    namespace: "capyclaw"
  asynq:
    redis_addr: "redis-cluster:6379"

# ── Wetland (Platform Services) ───────────────────────────────────────────
wetland:
  vapor:
    otlp_endpoint: "http://otel-collector:4317"
    service_name: "capyclaw-gateway"
    service_version: "0.1.0"
  canopy:
    vault_addr: "https://vault:8200"
    vault_token: "" # Use VAULT_TOKEN env var or K8s auth

# ── Burrow (Agent Core) ─────────────────────────────────────────────────
burrow:
  default_model: "claude-sonnet-4-6"
  max_context_tokens: 200000       # context window size
  compaction:
    trigger_threshold: 0.80        # compact when tokens exceed this ratio of max
    summary_model: ""              # empty = use default_model

# ── LLM Providers ────────────────────────────────────────────────────────
# Providers are tried in order as failover chain.
# Anthropic: native Claude API (tool_use via content blocks)
# MiniMax: Anthropic-compatible API (MiniMax models)
# OpenAI: OpenAI-compatible API (tool_calls via function calling)
# VolcEngine: 火山引擎方舟 API, OpenAI-compatible (doubao models)
# Google: Gemini API
# Ollama: local models
providers:
  anthropic:
    api_key: "vault:secret/capyclaw/llm#anthropic_key"
    base_url: "https://api.anthropic.com"
    models:
      - "claude-sonnet-4-20250514"
      - "claude-opus-4-20250514"
      - "claude-haiku-4-20250514"
  minimax:
    api_key: "vault:secret/capyclaw/llm#minimax_key"
    base_url: "https://api.minimaxi.com/anthropic"
    models:
      - "MiniMax-M2.7"
      - "MiniMax-M1-80k"
  openai:
    api_key: "vault:secret/capyclaw/llm#openai_key"
    base_url: "https://api.openai.com"
    models:
      - "gpt-4o"
      - "gpt-4o-mini"
      - "o3-mini"
  volcengine:
    api_key: "vault:secret/capyclaw/llm#volcengine_key"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    models:
      - "doubao-seed-2.0-pro"
      - "doubao-seed-2.0-lite"
      - "doubao-seed-2.0-code"
      - "deepseek-v3.2"
      - "kimi-k2.5"
      - "glm-4.7"
  google:
    api_key: "vault:secret/capyclaw/llm#google_key"
    models:
      - "gemini-2.0-flash"
      - "gemini-2.5-pro"
  ollama:
    base_url: "http://ollama:11434"
    models:
      - "llama3.2"
      - "qwen3:8b"
