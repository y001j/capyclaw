# Local development stack for CapyClaw.
# Provides: PostgreSQL + pgvector, Redis, Temporal, Vault (dev mode)

services:
  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: capyclaw
      POSTGRES_PASSWORD: capyclaw_dev
      POSTGRES_DB: capyclaw
    ports:
      - "18700:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capyclaw"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    ports:
      - "18800:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Temporal (all-in-one for dev) ─────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: capyclaw
      POSTGRES_PWD: capyclaw_dev
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  # ── HashiCorp Vault (dev mode) ────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    command: server -dev -dev-root-token-id="capyclaw-dev-token"
    environment:
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK

  # ── CapyClaw Gateway ──────────────────────────────────────────────────────
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    ports:
      - "18789:18789"
    environment:
      CAPYCLAW_POND_POSTGRES_DSN: "postgres://capyclaw:capyclaw_dev@postgres:5432/capyclaw"
      CAPYCLAW_POND_REDIS_ADDR: "redis:6379"
      CAPYCLAW_LODGE_TEMPORAL_HOST_PORT: "temporal:7233"
      CAPYCLAW_WETLAND_CANOPY_VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "capyclaw-dev-token"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./capyclaw.yaml:/etc/capyclaw/capyclaw.yaml:ro

  # ── Meadow (Frontend) ─────────────────────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_GATEWAY_WS_URL: "ws://localhost:18789"
      NEXT_PUBLIC_GATEWAY_HTTP_URL: "http://localhost:18789"
    depends_on:
      - gateway

volumes:
  postgres_data:
