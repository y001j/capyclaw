apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: capyclaw
data:
  capyclaw.yaml: |
    version: "0.1.0"
    log_level: info
    riverbank:
      host: "0.0.0.0"
      port: 18789
      tls:
        enabled: false
      websocket:
        max_connections: 10000
        allowed_origins:
          - "https://capyclaw.example.com"
      auth:
        provider: jwt
        jwt:
          signing_method: ES256
          public_key_path: /etc/capyclaw/keys/jwt-public.pem
    rapids:
      enabled: true
      default_limits:
        per_minute: 60
        per_hour: 1000
    burrow:
      default_model: "claude-sonnet-4-20250514"
      context_window: 200000
      compaction_threshold: 0.8
    pond:
      postgres:
        host: postgres
        port: 5432
        database: capyclaw
        username: capyclaw
        password: ""  # Use secret reference
    lodge:
      redis:
        addresses:
          - "redis:6379"
